>`;
  }else if(step===2){
    b.innerHTML=`<div class="entry-bar" style="justify-content:center;gap:8px;width:65%;margin:0 auto"><span style="color:#FF6B00;font-size:14px">✦</span><span style="font-size:14px;color:#999">正在修改中...</span><span class="stop-btn" onclick="goStep(3)" style="width:24px;height:24px;border-radius:50%;border:1.5px solid #ddd;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:4px"><svg width="9" height="9" viewBox="0 0 9 9"><rect width="9" height="9" rx="2" fill="#666"/></svg></span></div>`;
    // Add sweep mask
    var existingMask=document.querySelector('.sweep-mask');if(existingMask)existingMask.remove();
    var mask=document.createElement('div');mask.className='sweep-mask';document.querySelector('.phone-inner').appendChild(mask);
  }else if(step===3){
    b.innerHTML=`<div class="entry-bar" style="flex-direction:column;gap:8px;padding:12px 16px"><div style="display:flex;align-items:center;width:100%"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="cursor:pointer" onclick="goStep(0)"><path d="M13 4L7 10l6 6" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="flex:1;text-align:center;font-size:15px;font-weight:500;color:#1a1a1a">修改人名</span><button style="width:32px;height:32px;border-radius:50%;background:#FFD700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center" onclick="goStep(4)"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l4 4 6-7" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><button style="padding:8px 20px;border-radius:20px;border:1px solid #e0e0e0;background:#fff;font-size:13px;color:#666;cursor:pointer;display:flex;align-items:center;gap:4px"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="#999" stroke-width="1.2"/><path d="M5 7h4M7 5v4" stroke="#999" stroke-width="1.2" stroke-linecap="round"/></svg>原文</button></div>`;
  }
}

function goStep(n){step=n;render();}
function autoPlay(){step=0;render();clearTimeout(timer);function next(){if(step<4){step++;render();timer=setTimeout(next,step===2?4500:2500);}};timer=setTimeout(next,2500);}
render();
</script></body></html>
